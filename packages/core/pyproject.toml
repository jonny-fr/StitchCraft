[project]
name = "stitchcraft-core"
version = "0.1.0"
description = "Stitchcraft core: notation parser, stitch graph, shape solver, yarn model, export"
requires-python = ">=3.14,<3.15"
dependencies = [
    "lark>=1.2",
    "numpy>=2.1",
    "pillow>=13.0.0",
    "scipy>=1.14",
    "trimesh>=4.5",
]

[project.scripts]
stitchcraft = "stitchcraft_core.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stitchcraft_core"]
