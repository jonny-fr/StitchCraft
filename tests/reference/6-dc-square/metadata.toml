# The same pattern in US and UK terms. "ch"/"tr" alone do not tell US from UK terms, so
# the dialect of each file is stated here instead of detected.
[dialects]
"pattern.txt" = "de"
"pattern.en-US.txt" = "en-US"
"pattern.en-UK.txt" = "en-UK"
