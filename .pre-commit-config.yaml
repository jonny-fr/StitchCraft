repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: no-coauthor-trailer
        name: commit message without co-author trailer
        entry: sh -c '! grep -qi "^co-authored-by:" "$1"' --
        language: system
        stages: [commit-msg]
