[project]
name = "stitchcraft-mcp"
version = "0.1.0"
description = "Stitchcraft MCP server (FastMCP): validate, parse, preview, stitch vocabulary"
requires-python = ">=3.14,<3.15"
dependencies = [
    "stitchcraft-core",
    "stitchcraft-api",
    "mcp>=2",
    "httpx>=0.27",
]

[project.scripts]
stitchcraft-mcp = "stitchcraft_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stitchcraft_mcp"]
