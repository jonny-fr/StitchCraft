[project]
name = "stitchcraft-api"
version = "0.1.0"
description = "Stitchcraft HTTP API"
requires-python = ">=3.14,<3.15"
dependencies = [
    "stitchcraft-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stitchcraft_api"]
