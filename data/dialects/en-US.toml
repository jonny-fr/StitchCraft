[meta]
id = "en-US"
name = "English (US terms)"
turning_chain_counts = false

[stitches]
ch = ["ch", "chain", "chains"]
slst = ["sl st", "slst", "slip stitch", "ss"]
sc = ["sc", "single crochet"]
hdc = ["hdc", "half double crochet"]
dc = ["dc", "double crochet"]
tr = ["tr", "treble crochet", "treble"]

[macros]
inc = ["inc", "increase"]
dec = ["dec", "decrease"]
invdec = ["invdec", "inv dec", "invisible decrease", "invisible dec"]

[loops]
blo = ["BLO", "in back loops only", "in back loop only", "back loop only"]
flo = ["FLO", "in front loops only", "in front loop only", "front loop only"]

[keywords]
ring = ["in a magic ring", "in magic ring", "in MR", "in the magic ring", "magic ring", "MR"]
turn = ["turn"]
each = ["around", "in each st", "in each stitch", "in each st around"]
round_label = ["Round", "Rnd", "Rnd.", "Rd"]
row_label = ["Row"]
row_label_short = ["R"]
ignored = ["Stuff", "Fasten off", "Finish off", "Weave in ends"]
color_change = ["change to", "switch to", "with color", "with colour", "in color", "in colour"]
palette = ["Colors", "Colours", "Yarn colors"]
glossary = ["Abbreviations", "Abbreviations used", "Glossary"]
same = ["in same st", "in the same st", "in same stitch", "in the same stitch", "in next st",
  "in the next st", "in next stitch", "in the next stitch", "in one st", "in 1 st"]
skip = ["sk next", "skip next", "sk", "skip"]
stitch_word = ["st", "sts", "stitch", "stitches"]
together = ["together"]

[detect]
language = "en"
priority = 0  # preferred when US and UK cannot be told apart (with a warning)
markers = ["sc", "hdc", "sl st", "slst", "hdc2tog", "single crochet", "half double crochet",
  "US terms", "US terminology", "(US)"]
language_markers = ["ch", "dc", "tr", "inc", "dec", "Rnd", "Round", "Row", "turn", "st", "sts",
  "magic ring", "around", "stitch", "chain"]

[print]
round = "Rnd"
row = "Row"
ring = "in MR"
each = "in each st"
same = "in next st"
skip = "sk"
color_change = "change to"
palette = "Colors"
