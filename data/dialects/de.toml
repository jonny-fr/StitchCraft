[meta]
id = "de"
name = "Deutsch"
# turning chain counts as a stitch? (sc rows: no)
turning_chain_counts = false

[stitches]
ch = ["Lm", "Luftmasche", "Luftmaschen"]
slst = ["Km", "Kettmasche", "Kettmaschen"]
sc = ["fM", "f M", "feste Masche", "feste Maschen"]
hdc = ["hStb", "halbes Stäbchen", "halbe Stäbchen"]
dc = ["Stb", "Stäbchen"]
tr = ["DStb", "Doppelstäbchen"]

[macros]
inc = ["zun", "Zunahme", "Zunahmen", "verd"]
dec = ["abn", "Abnahme", "Abnahmen"]
invdec = ["uabn", "unsichtbare Abnahme", "unsichtbare Abnahmen", "unsichtb. Abn."]

[loops]
blo = ["nur hMg", "nur in das hintere Maschenglied", "nur in die hinteren Maschenglieder", "hMg"]
flo = ["nur vMg", "nur in das vordere Maschenglied", "nur in die vorderen Maschenglieder", "vMg"]

[keywords]
ring = ["in den MR", "in einen MR", "in MR", "in den Fadenring", "in einen Fadenring", "in Fadenring", "MR", "Fadenring"]
turn = ["wenden"]
each = ["rundum", "in jede M", "in jede Masche"]
round_label = ["Runde", "Rd.", "Rd", "Rnd."]
row_label = ["Reihe", "R."]
row_label_short = ["R"]
ignored = ["Füllen", "Ausstopfen", "Faden abschneiden", "Faden vernähen", "Fertigstellen", "Beenden"]
color_change = ["Farbwechsel zu", "Farbwechsel auf", "Farbwechsel", "FbW", "mit Farbe", "in Farbe"]
palette = ["Farben", "Garnfarben"]
glossary = ["Abkürzungen", "Abkürzungsverzeichnis", "Abk."]
same = ["in 1 M", "in 1 Masche", "in eine M", "in eine Masche", "in einer M", "in dieselbe M",
  "in dieselbe Masche", "in die gleiche M", "in die gleiche Masche", "in die nächste M", "in die nächste Masche"]
skip = ["überspringen", "überspr.", "übersp.", "auslassen"]
stitch_word = ["M", "Masche", "Maschen"]
together = ["zus. abm.", "zus. abmaschen", "zusammen abmaschen", "zusammen abm.", "zus abm"]

[detect]
language = "de"
priority = 0
markers = ["fM", "Lm", "Km", "hStb", "Stb", "DStb", "zun", "abn", "Runde", "Reihe", "wenden", "Fadenring",
  "Masche", "Maschen", "feste Masche", "Stäbchen", "hMg", "vMg", "FbW"]
language_markers = []
