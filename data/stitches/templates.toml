# Yarn templates v1: control points of the yarn centre line for one stitch.
# Each point is [u, v, n, anchor]:
#   u  along the working direction, in stitch widths (-0.5 = junction with the previous stitch)
#   v  from the parent's top (0) to this stitch's top (1), in stitch heights
#   n  towards the worker, in compressed yarn radii
#   anchor 0 = this stitch's base, 1 / 2 = top of the first / second parent (decreases)
# First and last points are the junctions shared with the neighbouring stitches.
version = 1

# Single crochet (layered). n is in compressed yarn radii; the parent's top loops lie at
# n = +-1.2, so strands passing them go to +-3.2 and the hole lies 0.45 heights below.
# Path: back strand behind the parent's back loop, through the hole to the front, front leg
# up, front loop across the top, front leg down, back through the hole, yarn over up the
# back to the back loop. Strands sharing a layer keep >= 2 radii apart.
[sc.both]
points = [
  [ -0.50,   1.00,   0.0, 0],
  [ -0.40,   0.75,  -1.4, 0],
  [ -0.37,   0.25,  -2.6, 0],
  [ -0.13,  -0.10,  -3.2, 0],
  [ -0.13,  -0.45,  -1.2, 0],
  [ -0.13,  -0.50,   0.0, 0],
  [ -0.13,  -0.45,   1.2, 0],
  [ -0.13,  -0.10,   3.2, 0],
  [ -0.37,   0.35,   2.2, 0],
  [ -0.36,   0.82,   1.2, 0],
  [  0.02,   1.00,   1.2, 0],
  [  0.36,   0.82,   1.2, 0],
  [  0.37,   0.35,   2.2, 0],
  [  0.13,  -0.10,   3.2, 0],
  [  0.13,  -0.45,   1.2, 0],
  [  0.13,  -0.50,   0.0, 0],
  [  0.13,  -0.45,  -1.2, 0],
  [  0.13,  -0.10,  -3.2, 0],
  [  0.37,   0.25,  -2.6, 0],
  [  0.40,   0.75,  -1.4, 0],
  [  0.40,   0.98,  -1.2, 0],
  [  0.50,   1.00,   0.0, 0],
]

