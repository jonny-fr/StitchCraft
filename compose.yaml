# docker compose up  ->  UI http://localhost:8080, API :8000, MCP (Streamable HTTP) http://localhost:8765/mcp
# MCP over stdio (Claude Code/Desktop):  docker compose run --rm -i mcp stdio
# api and mcp share one image and the `cache` volume. The snapshot renderer follows in M4 (task 10).
services:
  api:
    image: stitchcraft-server
    build: &server-build
      context: .
      dockerfile: services/api/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - cache:/cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  mcp:
    image: stitchcraft-server
    build: *server-build
    entrypoint: ["stitchcraft-mcp"]
    command: ["http", "--host", "0.0.0.0"]  # `run --rm -i mcp stdio` replaces this
    ports:
      - "8765:8765"
    volumes:
      - cache:/cache
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8765), 3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  cache:
