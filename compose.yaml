# docker compose up  ->  UI http://localhost:8080, API :8000, MCP (Streamable HTTP) http://localhost:8765/mcp
# MCP over stdio (Claude Code/Desktop):  docker compose run --rm -i mcp stdio
# api and mcp share one image and the `cache` volume.
# PNG snapshots for render_preview need the optional renderer:  docker compose --profile snapshot up -d
# (Chromium with software WebGL; slow on Apple Silicon, so it is off by default and mcp degrades to GLB + stats)
services:
  api:
    image: stitchcraft-server
    build: &server-build
      context: .
      dockerfile: services/api/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - cache:/cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  mcp:
    image: stitchcraft-server
    build: *server-build
    entrypoint: ["stitchcraft-mcp"]
    command: ["http", "--host", "0.0.0.0"]  # `run --rm -i mcp stdio` replaces this
    ports:
      - "8765:8765"
    environment:
      STITCHCRAFT_SNAPSHOT_URL: http://snapshot:8770  # unreachable unless the `snapshot` profile runs
    volumes:
      - cache:/cache
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8765), 3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy

  snapshot:
    profiles: [snapshot]
    build: services/snapshot
    depends_on:
      web:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8770/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  cache:
